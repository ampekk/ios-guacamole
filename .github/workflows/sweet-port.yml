name: sweet-port

# Attempt to build the iOS 27 SWEET kernel: xnu-12377 + the full SWEET port
# (patched from xnu-8796) as a single consolidated patch. First build is a
# probe: expect compile errors where the 8796-era SWEET code meets the 12377
# kernel API; the build tree and log are uploaded for local iteration.

on:
  push:
    branches: [sweet-port]
  workflow_dispatch:
    inputs:
      keep_going:
        description: make -k (collect all compile errors in one run)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sweet-port-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "26.5"
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build driver and apply SWEET port patch
        run: |
          set -e
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          mkdir -p dxb/patches/26.0
          # The consolidated patch is generated against the tree that DXB's own
          # patches produce (verified with git apply --check locally); apply it
          # last so it sees that exact state.
          cp xnu/sweet-port-ci.patch dxb/patches/26.0/zz9-sweet-port-ci.patch
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64" VALID_ARCHS="x86_64 arm64"/' dxb/build.sh
          sed -i '' 's/ARCHS="arm64 arm64e" VALID_ARCHS="arm64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64"/' dxb/build.sh
          grep -c 'ARCHS="x86_64 arm64"' dxb/build.sh
          ls -la dxb/patches/26.0/

      - name: Dependencies and Xcode
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          XC=""
          for CAND in /Applications/Xcode_26.5.app /Applications/Xcode_26.5.0.app \
                      /Applications/Xcode_26.4.1.app /Applications/Xcode_26.3.0.app \
                      /Applications/Xcode_26.3.app /Applications/Xcode_26.6.app; do
            if [ -d "$CAND" ]; then XC="$CAND"; break; fi
          done
          if [ -z "$XC" ]; then echo "No Xcode 26.x found"; ls -d /Applications/Xcode*.app; exit 1; fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          SDKVER=$(xcrun --sdk macosx --show-sdk-version)
          echo "SDK: $SDKVER"
          case "$SDKVER" in 26.*) ;; *) echo "Expected SDK 26.*"; exit 1 ;; esac

      - name: Build XNU 12377 + SWEET
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ (github.event_name != 'workflow_dispatch' || inputs.keep_going) && '-k' || '' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Verify patch actually applied
        if: always()
        run: |
          if grep -q 'Skipping patch.*zz9-sweet-port-ci' dxb/build.log; then
            echo "::error::consolidated SWEET patch was SKIPPED by DXB"
            exit 1
          fi
          if ! grep -q 'Applying patch.*zz9-sweet-port-ci' dxb/build.log; then
            echo "::error::consolidated SWEET patch was never applied"
            exit 1
          fi
          echo "consolidated SWEET patch applied (not skipped)"

      - name: Collect kernel and build context
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          KERNEL=$(find dxb/build dxb/fakeroot -name '*.dSYM' -prune -o -type f -name 'kernel.development.*' -print 2>/dev/null | head -1)
          if [ -n "$KERNEL" ]; then
            cp "$KERNEL" out/
            echo "kernel: $KERNEL"
            lipo -info "out/$(basename "$KERNEL")" || true
            (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          else
            echo "::warning::no kernel produced"
          fi
          cp dxb/build.log out/build.log 2>/dev/null || true
          tar czf out/buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu build.log 2>/dev/null || true
          # Count compile errors for the summary
          echo "compile_errors: $(grep -c 'error:' dxb/build.log || true)"
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweet-port-build
          path: out/
          if-no-files-found: warn
          retention-days: 14
